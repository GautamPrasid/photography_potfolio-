<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="About Dear Praa — photographer and film maker based in Pokhara, Nepal.">
    <title>Dear Praa | About</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="css/master.css">
    <link rel="icon" type="image/png" href="assets/icon logo.png">
</head>
<body>
    <!-- Header -->
    <header class="site-header" id="mainHeader">
        <a class="nav__logo" href="home.html" aria-label="Dear Praa home">
            <img src="assets/logo.png" alt="Dear Praa">
        </a>
        <button class="nav__menu__btn" id="menu-btn" type="button" aria-label="Open navigation" aria-expanded="false">
            <i class="ri-menu-3-line"></i>
        </button>
        <nav aria-label="Main navigation">
            <ul class="nav__links" id="nav-links"></ul>
        </nav>
        <div class="site-header__socials" data-social-location="header" aria-label="Social links"></div>
    </header>

    <!-- Main Content -->
    <main class="main-wrapper">
        <!-- About Section -->
        <section class="about-container">
            <div class="about-image">
                <img src="assets/about.png" alt="Dear Praa">
            </div>
            <div class="about-content">
                <h1 data-content="about.title"></h1>
                <p data-content="about.description"></p>
                <p data-content="about.biography"></p>
                <div class="site-section__socials" data-social-location="about" aria-label="About social links"></div>
                <div class="hire-me-section">
                    <button id="hireMeBtn" class="hire-me-btn">
                        <span>Hire Me</span>
                        <i class="ri-send-plane-fill"></i>
                    </button>
                </div>
            </div>
        </section>

        <section class="section__container cms-photo-section" data-photo-location="about" hidden></section>

        <!-- Skills Section -->
        <section class="skills-container">
            <div class="section-header">
                <h2 data-content="about.skillsTitle"></h2>
                <p data-content="about.skillsDescription"></p>
            </div>
            <div class="skills-grid">
                <div class="skill-item">
                    <div class="skill-icon"><i class="ri-camera-line"></i></div>
                    <div class="skill-info">
                        <div class="skill-name">
                            <span>Photography</span>
                            <span class="skill-percent">95%</span>
                        </div>
                        <div class="skill-bar"><div class="skill-progress" data-width="95"></div></div>
                    </div>
                </div>
                <div class="skill-item">
                    <div class="skill-icon"><i class="ri-edit-line"></i></div>
                    <div class="skill-info">
                        <div class="skill-name">
                            <span>Photo Editing</span>
                            <span class="skill-percent">90%</span>
                        </div>
                        <div class="skill-bar"><div class="skill-progress" data-width="90"></div></div>
                    </div>
                </div>
                <div class="skill-item">
                    <div class="skill-icon"><i class="ri-contrast-line"></i></div>
                    <div class="skill-info">
                        <div class="skill-name">
                            <span>Lightroom</span>
                            <span class="skill-percent">85%</span>
                        </div>
                        <div class="skill-bar"><div class="skill-progress" data-width="85"></div></div>
                    </div>
                </div>
                <div class="skill-item">
                    <div class="skill-icon"><i class="ri-image-edit-line"></i></div>
                    <div class="skill-info">
                        <div class="skill-name">
                            <span>Photoshop</span>
                            <span class="skill-percent">80%</span>
                        </div>
                        <div class="skill-bar"><div class="skill-progress" data-width="80"></div></div>
                    </div>
                </div>
                <div class="skill-item">
                    <div class="skill-icon"><i class="ri-video-line"></i></div>
                    <div class="skill-info">
                        <div class="skill-name">
                            <span>Video Editing</span>
                            <span class="skill-percent">75%</span>
                        </div>
                        <div class="skill-bar"><div class="skill-progress" data-width="75"></div></div>
                    </div>
                </div>
                <div class="skill-item">
                    <div class="skill-icon"><i class="ri-palette-line"></i></div>
                    <div class="skill-info">
                        <div class="skill-name">
                            <span>Creative Design</span>
                            <span class="skill-percent">88%</span>
                        </div>
                        <div class="skill-bar"><div class="skill-progress" data-width="88"></div></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="section__container footer__container">
            <div class="footer__col">
                <h3 data-content="footer.contactTitle"></h3>
                <p data-content="footer.introduction"></p>
            </div>
            <div class="footer__col">
                <h3 data-content="footer.officeTitle"></h3>
                <p data-content="contact.location"></p>
            </div>
            <div class="footer__col">
                <h3 data-content="footer.socialTitle"></h3>
                <ul class="footer__socials" data-social-location="footer"></ul>
            </div>
        </div>
        <div class="footer__bar">
            <span data-content="footer.copyright"></span>
        </div>
    </footer>

    <!-- Hire Me Modal -->
    <div id="hireModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 data-content="contact.closingTitle"></h2>
            <form id="contactForm">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <textarea name="message" placeholder="Tell me about your project..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>

    <script src="Javascript/public-cms.js"></script>
    <script src="Javascript/about.js"></script>
</body>
</html>
