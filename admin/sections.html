<template id="sections-view-template">
  <section class="admin-card">
    <div class="admin-toolbar">
      <input type="search" id="section-search" placeholder="Search sections">
      <button class="admin-button" data-action="add-section">+ Create Section</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Order</th><th>Title</th><th>Name</th><th>Slug</th><th>Visibility</th><th>Order #</th><th>Actions</th></tr></thead>
        <tbody id="section-rows"></tbody>
      </table>
    </div>
  </section>
</template>

<template id="section-row-template">
  <tr draggable="true" class="drag-row" data-id="">
    <td class="drag-handle">☰</td><td><strong data-section-title></strong></td><td data-section-name></td>
    <td data-section-slug></td><td data-section-visibility></td><td data-section-order></td>
    <td class="admin-actions">
      <button data-action="edit-section">Edit</button>
      <button data-action="toggle-section"></button>
      <button data-action="delete-section">Delete</button>
    </td>
  </tr>
</template>
